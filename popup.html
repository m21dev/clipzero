<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipZero</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="header">
      <div class="brand">
        <img src="icons/icon-48.png" alt="ClipZero" class="logo" width="20" height="20">
        <div class="brand-text">
          <div class="title-row">
            <h1 class="title">ClipZero</h1>
            <span class="version">1.3.3</span>
          </div>
          <p class="subtitle" id="host-label" data-i18n="popupChecking">Checking tab…</p>
        </div>
      </div>
      <span class="status is-standby" id="status-badge">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text" data-i18n="popupStandbyBadge">Off</span>
      </span>
    </header>

    <div class="divider"></div>

    <div class="notice-area" id="notice-area" hidden>
      <p class="notice-banner" id="standby-banner" data-i18n="popupStandbyBanner">Open a supported AI chat, social, or webmail tab to adjust settings.
Keyboard shortcuts apply to those tabs.</p>
      <button type="button" class="notice-action-btn" id="notice-action-btn" hidden></button>
    </div>

    <div class="tab-bar" role="tablist" aria-label="ClipZero tabs">
      <button type="button" class="tab-btn" id="tab-main" role="tab" aria-selected="true" aria-controls="panel-main" data-tab="main" data-i18n="popupTabProtection">Protection</button>
      <button type="button" class="tab-btn" id="tab-advanced" role="tab" aria-selected="false" aria-controls="panel-advanced" tabindex="-1" data-tab="advanced" data-i18n="popupMoreSettings">More settings</button>
    </div>

    <div class="divider"></div>

    <section class="tab-panel" id="panel-main" role="tabpanel" aria-labelledby="tab-main" aria-label="ClipZero settings">
      <button type="button" class="toggle-row" data-command="toggle-enabled" role="switch" aria-checked="true" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optEnabledTitle">Rename on upload</span>
          <span class="row-desc" data-i18n="optEnabledDesc">Paste, drag &amp; drop, and file picker</span>
        </span>
        <span class="row-right">
          <kbd class="kbd" data-shortcut-for="toggle-enabled">…</kbd>
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <button type="button" class="toggle-row" data-command="toggle-strict" role="switch" aria-checked="false" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optStrictTitle">Rename all files</span>
          <span class="row-desc" data-i18n="optStrictDesc">Custom names &amp; documents</span>
        </span>
        <span class="row-right">
          <kbd class="kbd" data-shortcut-for="toggle-strict">…</kbd>
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <button type="button" class="toggle-row" data-command="toggle-exif" role="switch" aria-checked="true" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optExifTitle">Strip metadata</span>
          <span class="row-desc" data-i18n="optExifDesc">JPEG EXIF/GPS, PNG, WebP, SVG &amp; PDF</span>
        </span>
        <span class="row-right">
          <kbd class="kbd" data-shortcut-for="toggle-exif">…</kbd>
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <button type="button" class="toggle-row" data-command="toggle-redact" role="switch" aria-checked="false" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optRedactTitle">Redact before upload</span>
          <span class="row-desc" data-i18n="optRedactDesc">Hide sensitive areas on canvas</span>
        </span>
        <span class="row-right">
          <kbd class="kbd" data-shortcut-for="toggle-redact">…</kbd>
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <button type="button" class="toggle-row" data-command="toggle-secrets" role="switch" aria-checked="true" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optSecretsTitle">Protect keys &amp; tokens</span>
          <span class="row-desc" data-i18n="optSecretsDesc">Mask API secrets, cards, IBANs &amp; URLs on paste</span>
        </span>
        <span class="row-right">
          <kbd class="kbd" data-shortcut-for="toggle-secrets">…</kbd>
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <button type="button" class="toggle-row" data-command="toggle-pii" role="switch" aria-checked="false" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optPiiTitle">Mask contacts &amp; IPs</span>
          <span class="row-desc" data-i18n="optPiiDesc">Emails, phones &amp; IP addresses on paste</span>
        </span>
        <span class="row-right">
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>
    </section>

    <section class="tab-panel" id="panel-advanced" role="tabpanel" aria-labelledby="tab-advanced" hidden>
      <button type="button" class="toggle-row" data-command="toggle-optimize" role="switch" aria-checked="false" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optOptimizeTitle">Resize large images</span>
          <span class="row-desc" data-i18n="optOptimizeDesc">Cap longest edge at 2048 px</span>
        </span>
        <span class="row-right">
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <button type="button" class="toggle-row" data-command="toggle-toast" role="switch" aria-checked="true" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optToastTitle">Show notice</span>
          <span class="row-desc" data-i18n="optToastDesc">Brief on-screen confirmation</span>
        </span>
        <span class="row-right">
          <kbd class="kbd" data-shortcut-for="toggle-toast">…</kbd>
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <button type="button" class="toggle-row" data-command="toggle-save" role="switch" aria-checked="false" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optSaveTitle">Remember this site</span>
          <span class="row-desc" data-i18n="optSaveDesc">Keep settings for this domain</span>
        </span>
        <span class="row-right">
          <kbd class="kbd" data-shortcut-for="toggle-save">…</kbd>
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <button type="button" class="toggle-row" data-command="toggle-debug" role="switch" aria-checked="false" disabled>
        <span class="row-main">
          <span class="row-title" data-i18n="optDebugTitle">Debug logs</span>
          <span class="row-desc" data-i18n="optDebugDesc">Privacy-safe traces in DevTools console</span>
        </span>
        <span class="row-right">
          <span class="switch" aria-hidden="true"><span class="thumb"></span></span>
        </span>
      </button>

      <div class="custom-words-box">
        <div class="custom-words-header">
          <label class="custom-words-label" for="custom-words-input">
            <span class="row-title" data-i18n="optCustomWordsTitle">Custom hidden words</span>
            <span class="row-desc" data-i18n="optCustomWordsDesc">Comma-separated names, clients, or projects</span>
          </label>
          <div class="custom-words-meta">
            <span id="custom-words-count" class="kbd">0/50</span>
            <button id="custom-words-clear" type="button" class="mini-link-btn" hidden data-i18n="optCustomWordsClear">Clear</button>
          </div>
        </div>
        <input type="text" id="custom-words-input" class="custom-words-input" maxlength="500" spellcheck="false" autocomplete="off" data-i18n-placeholder="optCustomWordsPlaceholder" placeholder="AcmeCorp, ProjectTitan, John Doe" disabled>
      </div>

      <div class="divider"></div>

      <footer class="footer">
        <button type="button" class="menu-item-btn" id="shortcuts-btn">
          <span data-i18n="popupShortcutsBtn">Keyboard shortcuts…</span>
          <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <a
          class="menu-item-btn sponsor-link"
          id="sponsor-link"
          href="https://github.com/sponsors/m21dev"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="sponsor-label">
            <svg class="sponsor-heart" viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
              <path d="M8 13.6s-4.8-3.05-6-5.95C1.2 5.7 2.4 3.5 4.55 3.5c1.3 0 2.35.72 3.45 1.98C9.1 4.22 10.15 3.5 11.45 3.5 13.6 3.5 14.8 5.7 14 7.65 12.8 10.55 8 13.6 8 13.6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="popupSupportBtn">Support · GitHub Sponsors</span>
          </span>
          <svg class="chevron" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
            <path d="M5.5 10.5L10.5 5.5M6.5 5.5H10.5V9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <p class="footer-hint" id="footer-hint" hidden></p>
      </footer>
    </section>
  </main>

  <script src="site_match.js"></script>
  <script src="popup.js"></script>
</body>
</html>
